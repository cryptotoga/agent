[project]
name = "drive-briefing-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "trafilatura>=2.3.1",
]

[project.scripts]
drive-briefing-agent = "drive_briefing_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
